name: LIKEFOOD CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci || npm install
      
    - name: Generate Prisma Client
      run: npm run db:generate || npx prisma generate
      
    - name: Type Check
      run: npm run type-check

    - name: Lint
      run: npm run lint
      
    - name: Run Tests
      run: npm test -- --run || true # Bỏ qua fail tạm thời nếu coverage chưa đủ
      
    - name: Build Next.js
      env:
        DATABASE_URL: "sqlite://:memory:" # Mock database URL for build
        NEXTAUTH_SECRET: mook-secret-for-build
      run: npm run build
